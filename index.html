<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Office Image Map with Popups</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
    }

    .popup {
      position: absolute;
      background: #fff;
      border: 1px solid #aaa;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <img src="meincvbuero.png" usemap="#image-map" id="imageMap">

  <map name="image-map">
    <!-- Graduation Cap -->
    <area shape="poly" coords="316,429,350,480,427,486,442,486,438,455,442,436,467,426,393,398"
          alt="cap" onclick="showPopup(event, '🎓 This is the graduation cap!')" href="#">

    <!-- Plant -->
    <area shape="poly" coords="1242,650,1243,678,1253,707,1285,710,1380,711,1382,692,1380,674,1383,657,1352,631,1306,626"
          alt="plant" onclick="showPopup(event, '🪴 This is the plant pot!')" href="#">

    <!-- Bag -->
    <area shape="poly" coords="887,687,879,748,881,810,888,828,968,834,1040,833,1055,810,1050,737,1048,699,1012,687,932,687"
          alt="bag" onclick="showPopup(event, '💼 This is the office bag!')" href="#">

    <!-- Laptop -->
    <area shape="rect" coords="613,392,826,518"
          alt="laptop" onclick="showPopup(event, '💻 This is the laptop screen!')" href="#">

    <!-- Drawing -->
    <area shape="poly" coords="925,262,951,216,967,227,968,250,983,254,995,267,993,286,995,308,989,320,967,322,940,314,925,288"
          alt="drawing" onclick="showPopup(event, '🖼️ This is the drawing on the wall!')" href="#">
  </map>

  <div id="popup" class="popup"></div>

  <!-- Make the image map responsive -->
  <script src="https://unpkg.com/image-map-resizer@1.0.10/js/imageMapResizer.min.js"></script>
  <script>
    window.addEventListener('load', () => {
      if (typeof imageMapResize === 'function') {
        imageMapResize();
      }
    });

    function showPopup(e, text) {
      e.preventDefault();
      const popup = document.getElementById('popup');
      popup.textContent = text;
      popup.style.left = e.pageX + 10 + 'px';
      popup.style.top = e.pageY + 10 + 'px';
      popup.style.display = 'block';
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('area')) {
        document.getElementById('popup').style.display = 'none';
      }
    });
  </script>
</body>
</html>
