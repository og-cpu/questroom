<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Interactive Image Map</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 100%;
      position: relative;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
    }

    .popup {
      position: absolute;
      background: #fff;
      border: 1px solid #aaa;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="meincvbuero.png" usemap="#workmap" id="officeImage" alt="My Office">

    <map name="workmap">
      <!-- 🎓 Graduation Cap (polygon shape) -->
      <area shape="poly"
        coords="335,415, 400,390, 460,410, 400,430"
        href="#"
        onclick="showPopup(event, '🎓 This is the graduation cap!')">

      <!-- 📕 Red Book (rectangular shape) -->
      <area shape="rect"
        coords="340,470,400,490"
        href="#"
        onclick="showPopup(event, '📕 Here is the red book!')">
    </map>

    <div id="popup" class="popup"></div>
  </div>

  <!-- Resize library for responsive maps -->
  <script src="https://unpkg.com/image-map-resizer@1.0.10/js/imageMapResizer.min.js"></script>

  <script>
    // Make map responsive
    window.addEventListener('load', () => {
      imageMapResize();
    });

    // Popup logic
    function showPopup(e, text) {
      e.preventDefault();
      const popup = document.getElementById("popup");
      popup.innerHTML = text;
      popup.style.left = e.pageX + 10 + "px";
      popup.style.top = e.pageY + 10 + "px";
      popup.style.display = "block";
    }

    // Hide popup when clicking outside
    document.addEventListener("click", function(e) {
      if (!e.target.closest("area")) {
        document.getElementById("popup").style.display = "none";
      }
    });
  </script>
</body>
</html>
