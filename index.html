<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Interactive Image</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 100%;
    }

    img {
      width: 100%;
      height: auto;
    }

    .popup {
      position: absolute;
      background: #fff;
      border: 1px solid #aaa;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="meincvbuero.png" usemap="#office" id="officeImage" alt="Office Image">

    <map name="office">
      <!-- Graduation Cap (roughly polygon shape) -->
      <area shape="poly"
        coords="335,415, 400,390, 460,410, 400,430"
        href="#"
        onclick="showPopup(event, '🎓 Graduation cap — symbol of achievement!')">

      <!-- Red Book -->
      <area shape="rect"
        coords="340,470,400,490"
        href="#"
        onclick="showPopup(event, '📕 Red book — full of knowledge!')">
    </map>

    <div id="popup" class="popup"></div>
  </div>

  <script>
    function showPopup(e, text) {
      e.preventDefault();

      const popup = document.getElementById("popup");
      popup.innerHTML = text;

      popup.style.left = e.pageX + 10 + "px";
      popup.style.top = e.pageY + 10 + "px";
      popup.style.display = "block";
    }

    document.addEventListener("click", function(e) {
      if (!e.target.closest("area")) {
        document.getElementById("popup").style.display = "none";
      }
    });

    // Make coordinates responsive
    function resizeMap() {
      const img = document.getElementById("officeImage");
      const originalWidth = 1536; // original image width
      const scale = img.clientWidth / originalWidth;

      const areas = document.querySelectorAll("area");
      areas.forEach(area => {
        const originalCoords = area.dataset.originalCoords || area.coords;
        if (!area.dataset.originalCoords) {
          area.dataset.originalCoords = originalCoords;
        }
        const scaledCoords = originalCoords.split(",").map(coord => Math.round(coord * scale));
        area.coords = scaledCoords.join(",");
      });
    }

    window.addEventListener("load", resizeMap);
    window.addEventListener("resize", resizeMap);
  </script>
</body>
</html>
