<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Office Scene</title>
  <style>
    .container {
      position: relative;
      display: inline-block;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    .hotspot {
      position: absolute;
      cursor: pointer;
    }
    .popup {
      display: none;
      position: absolute;
      background: #fff;
      border: 1px solid #aaa;
      padding: 10px;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      max-width: 200px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="meincvbuero.png" alt="Interactive Office">

    <!-- Graduation Cap -->
    <div class="hotspot" style="top: 390px; left: 330px; width: 120px; height: 80px;" onclick="showPopup(event, '🎓 Graduation cap — symbol of achievement!')"></div>

    <!-- Red Book -->
    <div class="hotspot" style="top: 470px; left: 340px; width: 60px; height: 20px;" onclick="showPopup(event, '📕 Red book — full of knowledge!')"></div>

    <div id="popup" class="popup"></div>
  </div>

  <script>
    const popup = document.getElementById('popup');
    function showPopup(event, text) {
      popup.textContent = text;
      popup.style.left = event.pageX + 10 + 'px';
      popup.style.top = event.pageY + 10 + 'px';
      popup.style.display = 'block';
    }
    document.addEventListener('click', function(e) {
      if (!e.target.classList.contains('hotspot')) {
        popup.style.display = 'none';
      }
    });
  </script>
</body>
</html>
