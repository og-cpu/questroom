
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quest Room CV</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="room">
    
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
  <rect width="800" height="600" fill="#f5f3ef"/>
  <g fill="#1c2b3a">
    <!-- Minimal scene placeholder -->
    <rect x="100" y="400" width="600" height="20"/> <!-- desk -->
    <rect x="370" y="370" width="60" height="30" fill="#e63946"/> <!-- laptop -->
    <rect x="650" y="200" width="80" height="300"/> <!-- bookshelf -->
    <rect x="690" y="250" width="10" height="50" fill="#e63946"/> <!-- red book -->
    <rect x="500" y="450" width="40" height="30"/> <!-- work bag -->
    <rect x="520" y="460" width="10" height="5" fill="#e63946"/> <!-- red clasp -->
    <rect x="450" y="370" width="40" height="10"/> <!-- graduation cap -->
    <rect x="470" y="380" width="5" height="10" fill="#e63946"/> <!-- red tassel -->
  </g>
</svg>

    <div id="bookshelf" class="clickable"></div>
    <div id="cap" class="clickable"></div>
    <div id="laptop" class="clickable"></div>
    <div id="bag" class="clickable"></div>
    <div id="drawer" class="clickable"></div>
    <div id="picture" class="clickable"></div>
  </div>
  <div id="popup" class="popup">
    <h2 id="popupTitle"></h2>
    <p id="popupContent"></p>
    <button onclick="closePopup()">Close</button>
  </div>
  <script src="./script.js"></script>
</body>
</html>
