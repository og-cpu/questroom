
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quest Room CV</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="room">
    
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
  <rect width="800" height="600" fill="#f0f0f0"/>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="24" fill="#333">
    Placeholder Background SVG
  </text>
</svg>

    <div id="bookshelf" class="clickable"></div>
    <div id="cap" class="clickable"></div>
    <div id="laptop" class="clickable"></div>
    <div id="bag" class="clickable"></div>
    <div id="drawer" class="clickable"></div>
    <div id="picture" class="clickable"></div>
  </div>
  <div id="popup" class="popup">
    <h2 id="popupTitle"></h2>
    <p id="popupContent"></p>
    <button onclick="closePopup()">Close</button>
  </div>
  <script src="./script.js"></script>
</body>
</html>
